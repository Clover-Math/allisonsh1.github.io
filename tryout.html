<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/poop.css">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <title>Tryout</title>
</head>

<body>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <header>
        <heading>
            <a href="/">
                <img src="img\cloverlogo.png" class="logo-image" alt="Clover Image">
            </a>
        </heading>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>                
                <li><a href="/ourtest">Our Test</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/register">Register</a></li>
                <li><a href="/tryout" style="color: rgb(75, 151, 86)">Tryout</a></li>
                <li><a href="/archive">Archive</a></li>
            </ul>
        </nav>
    </header>

    <div class="announcement">
        <b>Try Clover sample problems!</b>
    </div>

    <div class="subheader">
        Tryout Problems
    </div>

    <div class="text">
        Choose a form and solve random problems.
    </div>

    <div style="padding-left:30px;padding-right:30px;padding-bottom:20px;">
        <button class="button" style="width:180px;margin-right:25px;" onclick="start('A')">Form A</button>
        <button class="button" style="width:180px;" onclick="start('B')">Form B</button>
    </div>

    <div id="problemArea" style="display:none; text-align:center; padding:20px;">
        <div class="subheader" id="title"></div>
        <img id="problemImg" class="bannerimg">

        <div class="text" style="text-align:center;">
            Enter radicals like: <b>2*sqrt(13)</b>
        </div>
        <br>

        <input id="answerBox" type="text" placeholder="Enter answer" style="padding:10px; width:250px; font-family:Poppins;">
        <br><br>

        <button class="button" style="width:180px;" onclick="checkAnswer()">Submit Answer</button>
        <br><br>

        <div id="result" class="text" style="font-weight:bold; text-align:center;"></div>
        <br>

        <div id="solutionButtons" style="display:none;">
            <button class="button" style="width:200px; margin-right:25px;" onclick="showSolution()">Reveal Official Solution</button>
            <button class="button" style="width:180px;" onclick="nextProblem()">Next Problem</button>
        </div>
        <br><br>

        <img id="solutionImg" class="bannerimg" style="display:none;">
    </div>

    <footer>
        <div class="banner">
            <img src="/img/greenfooter.png" style="width:100%;">
            <div class="footer">
                <p>Email: <a href="mailto:contactclovermath@gmail.com">contactclovermath@gmail.com</a></p>
            </div>
        </div>
    </footer>

    <script>
    const data=[
        { form:"A", num:3, answer:"4", img:"/img/problems/A/3.jpg", sol:"/img/solutions/A/3.jpg" },
        { form:"A", num:7, answer:"4", img:"/img/problems/A/7.jpg", sol:"/img/solutions/A/7.jpg" },
        { form:"A", num:12, answer:"14", img:"/img/problems/A/12.jpg", sol:"/img/solutions/A/12.jpg" },
        { form:"A", num:19, answer:"sqrt(13)", img:"/img/problems/A/19.jpg", sol:"/img/solutions/A/19.jpg" },
        { form:"A", num:27, answer:"5", img:"/img/problems/A/27.jpg", sol:"/img/solutions/A/27.jpg" },
        { form:"B", num:2, answer:"134", img:"/img/problems/B/2.jpg", sol:"/img/solutions/B/2.jpg" },
        { form:"B", num:8, answer:"2", img:"/img/problems/B/8.jpg", sol:"/img/solutions/B/8.jpg" },
        { form:"B", num:13, answer:"1440", img:"/img/problems/B/13.jpg", sol:"/img/solutions/B/13.jpg" },
        { form:"B", num:21, answer:"5/12", img:"/img/problems/B/21.jpg", sol:"/img/solutions/B/21.jpg" },
        { form:"B", num:29, answer:"15/32", img:"/img/problems/B/29.jpg", sol:"/img/solutions/B/29.jpg" }
    ];

    let form="";
    let used=[];
    let current=null;

    function start(f){
        form=f;
        used=[];
        document.getElementById("problemArea").style.display="block";
        nextProblem();
    }

    function nextProblem(){
        let pool=data.filter(p=> p.form===form && !used.includes(p.num));
        if(pool.length===0){
            used=[];
            pool=data.filter(p=>p.form===form);
        }

        current=pool[Math.floor(Math.random()*pool.length)];
        used.push(current.num);

        document.getElementById("title").innerText="Form "+current.form+" Problem #"+current.num;
        document.getElementById("problemImg").src=current.img;
        document.getElementById("solutionImg").style.display="none";
        document.getElementById("answerBox").value="";
        document.getElementById("result").innerHTML="";
        document.getElementById("solutionButtons").style.display="none";
    }

    function checkAnswer(){
        let user=document.getElementById("answerBox").value.trim().toLowerCase();
        let correct=current.answer.toLowerCase();
        let result=document.getElementById("result");

        if(user===correct){
            result.innerHTML="✅ Correct!";
        } else {
            result.innerHTML="❌ Incorrect.<br><br>Correct answer: <b>"+current.answer+"</b>";
        }
        document.getElementById("solutionButtons").style.display="block";
    }

    function showSolution(){
        document.getElementById("solutionImg").src=current.sol;
        document.getElementById("solutionImg").style.display="block";
    }
    </script>
</body>
</html>
